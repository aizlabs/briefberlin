# BriefBerlin-specific UI strings, keyed by BARE language code (de, en, es, ...).
#
# The minimal-mistakes theme already ships ui-text.yml for all 8 of our locales;
# this file only holds the strings the theme does NOT provide.
#
# IMPORTANT: the `de` block must stay byte-identical to the strings previously
# hardcoded in _layouts/post.html, so the German pages render unchanged.
#
# `%d` placeholders are substituted with Liquid `replace`, not printf.
# Liquid cannot localize month NAMES, so date_format is numeric outside `en`.

