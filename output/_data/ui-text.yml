# Theme chrome strings for minimal-mistakes, keyed by site.locale ("de-DE").
#
# Jekyll 3 does not load _data from a theme gem, so the theme's own ui-text.yml
# never reaches this site and every string it looks up fell back to the English
# default baked into the include ("Categories:", "Share on", "You May Also
# Enjoy"). This file is that lookup table, in German.
#
# BriefBerlin's own strings - the ones our shadowed layouts and includes use -
# live in ui-briefberlin.yml and are keyed by BARE language code, because those
# templates also render the reader-language translation pages.
