{% unless site.newsletter.signup_open == false %}
<a class="newsletter-date-link" href="{{ '/newsletter/' | relative_url }}#anmeldung" aria-label="{{ include.t.newsletter_signup | default: 'Newsletter bestellen' | escape }}" title="{{ include.t.newsletter_signup | default: 'Newsletter bestellen' | escape }}">
  <svg aria-hidden="true" focusable="false" width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="16" height="12" rx="1"/><path d="m2 5 8 6 8-6"/></svg>
  {% if include.t.newsletter_signup %}<span>{{ include.t.newsletter_signup }}</span>{% else %}<span>Newsletter<span class="newsletter-date-link__verb"> bestellen</span></span>{% endif %}<span aria-hidden="true">→</span>
</a>
{% endunless %}
