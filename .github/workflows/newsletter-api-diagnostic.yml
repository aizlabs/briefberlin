name: Newsletter encrypted API diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet requests feedparser beautifulsoup4 pyyaml pydantic
      - name: Diagnose test-list draft creation (sending blocked)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          NEWSLETTER_ENABLED: 'false'
        run: python -m scripts.newsletter_api_diagnostic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-api-diagnostic
          path: diagnostic/api-error.enc
          if-no-files-found: ignore
          retention-days: 1
