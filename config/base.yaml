# BriefBerlin - Base Configuration

environment: base

# Sources for topic discovery and content fetching
sources:
  max_headlines_per_source: 20
  fetch_timeout: 10
  max_words_per_source: 300   # Truncate articles to this word count
  min_words_per_source: 100   # Minimum words for valid article
  max_sources_per_topic: 5    # Maximum sources to fetch per topic

# Topic discovery settings
discovery:
  min_sources: 3          # Minimum sources for topic validation
  max_topics: 15          # Total topics to discover
  output_limit: 10        # Topics to return to pipeline

# Topic ranking algorithm
ranking:
  source_weight: 3        # Multiplier for source count
  mention_weight: 2       # Multiplier for mention count
  mention_cap: 10         # Cap mentions at this value for scoring
  cultural_bonus: 5       # Bonus for learner-friendly topics
  avoid_penalty: -10      # Penalty for inappropriate topics

# Entity extraction settings
entity_extraction:
  min_entity_length: 2    # Minimum characters for entity
  entity_types:           # SpaCy entity types to extract
    - PER                 # Person
    - LOC                 # Location
    - ORG                 # Organization
    - MISC                # Miscellaneous

# Article generation settings
generation:
  private_trace: false  # Preserve drafts and judge feedback beside the first private input
  articles_per_run: 4
  levels:
    - A2
    - B1
  target_word_count:
    A2: 200
    B1: 300

  # Two-step synthesis settings
  two_step_synthesis:
    enabled: true                    # Toggle for two-step vs single-step generation
    save_base_article: false         # Save intermediate base articles for debugging
    base_article_path: ./output/base_articles/  # Where to save base articles
    regeneration_strategy: adaptation_only  # 'adaptation_only' or 'full_pipeline'

# Quality gate settings
quality_gate:
  # Calibrated for gpt-6.1-terra as grader: it scores ~0.5-1 lower than gpt-4o-mini did.
  min_score: 7.0
  max_attempts: 3

glossary:
  retry_on_empty: true
  debug_dump: false

# Reader-language translations of the published German posts.
#
# NOTE: this is a DIFFERENT AXIS from `language:` below, and the two never interact.
#   `language:`     the SITE-FORK axis - the one language the pipeline *teaches*.
#                   Drives the prompt pack, the spaCy model, the glossary rules and
#                   the learner-facing labels. See docs/language-profile-fork-guide.md.
#   `translations:` the COMPREHENSION-SUPPORT axis - the languages the finished
#                   German text is *rendered into* so a learner can read along.
# A Spanish fork of the site would change `language:` and keep its own, different,
# `translations:` list (probably dropping `es`).
#
# The translator reads none of language.prompt_pack / glossary_rules / spacy_model /
# glossary_heading. Translated pages use the per-language glossary_heading below.
#
# Presentation metadata (endonym, text direction, og:locale) is NOT here - it lives
# in output/_data/languages.yml, which the Jekyll templates own.
translations:
  enabled: true
  model: null              # null -> llm.models.translation
  temperature: 0.2
  max_workers: 4
  max_attempts: 2
  output_path: ./output/_translations
  # Applies to every level in generation.levels. Add `levels: [A2]` to an entry to
  # pilot a language on a single level.
  languages:
    - { code: en, name: English,   glossary_heading: "Vocabulary" }
    - { code: tr, name: Turkish,   glossary_heading: "Kelimeler" }
    - { code: ru, name: Russian,   glossary_heading: "Словарь" }
    - { code: ar, name: Arabic,    glossary_heading: "المفردات" }
    - { code: uk, name: Ukrainian, glossary_heading: "Словник" }
    - { code: pl, name: Polish,    glossary_heading: "Słowniczek" }
    - { code: es, name: Spanish,   glossary_heading: "Vocabulario" }

language:
  target_language: German
  target_language_code: de
  locale: de-DE
  learner_native_language: English
  spacy_model: de_core_news_sm
  glossary_heading: Vokabeln
  legacy_glossary_headings:
    - Vokabeln
  prompt_pack: german
  glossary_rules: german
  site_name: BriefBerlin

# Audio preparation (website first; Telegram and podcast later)
audio:
  enabled: false
  provider: elevenlabs
  format: mp3
  output_path: ./output/audio
  include_vocabulary: false
  upload_enabled: false
  public_base_url: ""
  s3:
    bucket: ""
    region: ""
    prefix: articles
  website:
    enabled: true
    highlighting_enabled: true
    highlight_context: sentence
  providers:
    openai:
      model: gpt-4o-mini-tts-2025-12-15
      voice: marin
    elevenlabs:
      model: eleven_multilingual_v2
      voice: OYTbf65OHHFELVut7v2H # Hope: bright, upbeat, multilingual
      output_format: mp3_44100_128
      speed_by_level:
        A2: 0.7
        B1: 0.8

# LLM configuration
llm:
  provider: openai  # or 'anthropic'
  models:
    generation: gpt-6.1-terra # For synthesis (Step 1)
    adaptation: gpt-6.1-terra # For level adaptation (Step 2) - can use cheaper model
    translation: gpt-6.1-terra # For reader-language translation (see `translations:`)
    quality_check: gpt-6.1-terra
  # Temperatures apply only to models that accept them (see model_options).
  temperature: 0.3
  quality_temperature: 0.1
  max_tokens: 8192
  # Per-model request options. A model not listed here gets the settings above.
  #   supports_temperature: false  -> no temperature is sent (model only accepts its default)
  #   reasoning_effort: low|medium|high -> for reasoning models; unset = model default
  model_options:
    gpt-5.5:
      supports_temperature: false
    gpt-6.1-sol:
      supports_temperature: false
    gpt-6.1-terra:
      supports_temperature: false
    gpt-6-luna:
      supports_temperature: false
  usage_reporting:
    enabled: true
    currency: USD
    pricing_as_of: 2026-11-07
    prices:
      openai:
        gpt-5.5:
          aliases: ["gpt-5.5-2026-04-23"]
          modality: text
          input_per_million: 5.00
          cached_input_per_million: 0.50
          output_per_million: 30.00
        gpt-6.1-sol:
          modality: text
          input_per_million: 2.00
          cached_input_per_million: 0.10
          output_per_million: 10.00
        gpt-6.1-terra:
          modality: text
          input_per_million: 1.00
          cached_input_per_million: 0.05
          output_per_million: 5.00
        gpt-6-luna:
          modality: text
          input_per_million: 0.10
          cached_input_per_million: 0.01
          output_per_million: 0.50
        gpt-4o-mini:
          aliases: ["gpt-4o-mini-????-??-??"]
          modality: text
          input_per_million: 0.15
          cached_input_per_million: 0.075
          output_per_million: 0.60
        gpt-4o-mini-tts:
          aliases: ["gpt-4o-mini-tts-*"]
          modality: audio
          supports_sse_usage: true
          input_per_million: 0.60
          output_per_million: 12.00
      elevenlabs:
        eleven_multilingual_v2:
          # Starter plan: $6 / 30,000 credits. Multilingual v2 uses one credit per character.
          # Update this rate and pricing_as_of before a generation when the subscription changes.
          modality: audio
          billing_unit: characters
          input_per_million: 200.00
          output_per_million: 0

# Output settings
output:
  format: jekyll
  path: ./output/_posts
  default_author: clara-becker

# Logging (overridden per environment)
logging:
  name: briefberlin
  level: INFO
  format: json
  file: output/logs/app.log

# Metrics
metrics:
  enabled: true
  output: output/metrics/

# Daily Brevo newsletter (see docs/newsletter-runbook.md).
# `enabled` is the production gate: while false the campaign builder only ever
# runs in --dry-run or --target test mode. List 3 = BriefBerlin Taeglich
# (confirmed subscribers), list 4 = BriefBerlin Test. List 2 must never be used.
newsletter:
  enabled: false
  site_base_url: https://briefberlin.de
  feed_url: https://briefberlin.de/feed.xml
  production_list_id: 3
  test_list_id: 4
  sender_name: BriefBerlin
  sender_email: newsletter@briefberlin.de
  send_hour_berlin: 7
  content_cutoff_hour_berlin: 6   # deterministic cutoff: runs later than this never change the issue content window
  min_lead_minutes: 30            # no production send closer than this to 07:00
  daily_email_limit: 300          # Brevo free plan
  daily_reserve: 60               # headroom for DOI + welcome mails
  first_run_lookback_days: 1
  abuse_threshold_24h: 25         # DOI/transactional volume alert threshold per 24h

# Alerts (in CI, enabled and email_config.smtp can be overridden by ALERTS_ENABLED, ALERT_SMTP_*, EMAIL_USERNAME, EMAIL_PASSWORD)
# Telegram alerts are configured in YAML via alerts.telegram.*
alerts:
  enabled: false                  # Global toggle for alert delivery
  email: your@email.com           # Recipient for alert emails (can be overridden via ALERT_EMAIL)
  cooldown_hours: 6               # Cooldown window to avoid duplicate alerts
  email_config:
    from: bot@briefberlin.de     # Sender address used for email alerts
    smtp:
      host: smtp.gmail.com        # SMTP host required for outbound mail
      port: 587                   # SMTP port
      username: ""                # SMTP username (required when server enforces auth)
      password: ""                # SMTP password (required when server enforces auth)
  telegram:
    enabled: false                # Send the same pipeline alerts to Telegram
    bot_token: ""                 # Telegram bot token from BotFather
    chat_id: ""                   # Telegram chat or channel ID to receive alerts
